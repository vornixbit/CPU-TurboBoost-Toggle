name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        # Pinned to the commit behind the tag (supply-chain hardening); the
        # comment records which tag it corresponds to.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            src/TurboToggle.csproj
            Directory.Build.props
            .editorconfig
            global.json

      - name: Resolve version from tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Refusing to build: '$TAG' is not a stable numeric v tag (expected vMAJOR.MINOR[.PATCH[.BUILD]])" >&2
            exit 1
          fi
          IFS='.' read -r -a parts <<< "${TAG#v}"
          for part in "${parts[@]}"; do
            if [ "$part" -gt 65534 ]; then
              echo "Refusing to build: '$TAG' has component $part exceeding 65534" >&2
              exit 1
            fi
          done
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build src/TurboToggle.csproj -c Release -p:Version=${{ env.VERSION }}

      - name: Regression tests (no system changes)
        # Same -p:Version as Build: tests exercise the exact same assembly
        # instead of triggering a recompile with a different version.
        run: dotnet run --project tests/TurboToggle.RegressionTests.csproj -c Release -p:Version=${{ env.VERSION }}

      - name: Publish (win-x64, self-contained, single file)
        run: >
          dotnet publish src/TurboToggle.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.VERSION }}
          -o publish/win-x64

      - name: Rename portable exe
        shell: bash
        run: mv publish/win-x64/TurboToggle.exe publish/win-x64/TurboToggle-portable.exe

      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI installer
        shell: bash
        run: |
          wix build setup/TurboToggle.wxs \
            -d Version="${VERSION}" \
            -d SourcePath="${GITHUB_WORKSPACE}/publish/win-x64" \
            -o "publish/TurboToggle-${VERSION}-setup.msi"

      - name: Upload portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TurboToggle-win-x64-portable
          path: publish/win-x64/TurboToggle-portable.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TurboToggle-win-x64-setup
          path: publish/TurboToggle-${{ env.VERSION }}-setup.msi
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: TurboToggle-win-x64-portable
          path: assets

      - name: Download installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: TurboToggle-win-x64-setup
          path: assets

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # GITHUB_ENV from the build job does not cross job boundaries,
          # so derive the tag here instead of reusing TAG.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          repo="${GITHUB_REPOSITORY}"
          version="${tag#v}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" assets/TurboToggle-portable.exe --repo "$repo" --clobber
            gh release upload "$tag" "assets/TurboToggle-${version}-setup.msi" --repo "$repo" --clobber
          else
            gh release create "$tag" \
              assets/TurboToggle-portable.exe \
              "assets/TurboToggle-${version}-setup.msi" \
              --repo "$repo" \
              --verify-tag \
              --title "Turbo Boost Toggle $tag" \
              --notes "$(cat <<EOF
          Automated build of Turbo Boost Toggle ${tag}.

          ## Assets

          | File | Description |
          |------|-------------|
          | \`TurboToggle-portable.exe\` | Portable single-file executable. Run from any folder. |
          | \`TurboToggle-${version}-setup.msi\` | Windows Installer (MSI). Installs to Program Files with Start Menu shortcut. Supports upgrade/uninstall via Windows Settings. |

          ## Installation

          **Portable:** Download \`TurboToggle-portable.exe\`, run it, allow the UAC prompt. No installation needed.

          **Installer:** Download the \`.msi\`, double-click, follow the wizard. The app installs to \`Program Files\\Turbo Toggle\` and adds a Start Menu shortcut. Uninstall via Settings > Apps > Installed apps.

          Both versions require administrator privileges and store settings in \`%APPDATA%\\TurboToggle\`.
          EOF
          )"
          fi
